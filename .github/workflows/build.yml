name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: TypeCheck
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

    - name: Runtime tests
      run: npm run test:runtime

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm test
